<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blueprint Delivery Retry — Super Cash Kid</title><style>body{font:17px system-ui;background:#101828;color:white;max-width:620px;margin:8vh auto;padding:24px}label{display:block;margin:22px 0 8px}input,button{box-sizing:border-box;width:100%;padding:15px;font:inherit;border-radius:8px}input{background:#fff;color:#111}button{background:#36d399;color:#08161b;border:0;font-weight:bold;cursor:pointer;margin-top:22px}p{line-height:1.5}#result{margin-top:20px}</style><h1>Blueprint delivery retry</h1><p>This private-use page retries the already-paid $4.99 Stripe sandbox order. It will not charge the customer again.</p><label for="key">Blueprint retry admin key</label><input id="key" type="password" autocomplete="off" placeholder="Paste BLUEPRINT_RETRY_ADMIN_KEY"><button id="retry">Resend Blueprint PDF</button><p id="result" role="status"></p><script>const button=document.getElementById('retry'),result=document.getElementById('result');button.onclick=async()=>{const key=document.getElementById('key').value.trim();if(!key){result.textContent='Enter the admin key first.';return}button.disabled=true;result.textContent='Verifying purchase and requesting email...';try{const response=await fetch('https://supercashkid-signup.onrender.com/admin/retry-blueprint',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({sessionId:'cs_test_a1QpKFRWE5SMR7ViTK2yNRuovg5saWCmPTJxiSGhmEW5C4KrdrTZ48Wp7x'})});const data=await response.json();result.textContent=response.ok?'Request accepted. Check your email and spam folder.':('Delivery failed ('+response.status+'): '+(data.error||'Unknown error'));}catch(e){result.textContent='Could not reach backend: '+e.message}finally{button.disabled=false}};</script></html>
